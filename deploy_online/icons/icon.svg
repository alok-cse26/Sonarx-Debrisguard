<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#03070d"/>
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0060ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4"/>
  <!-- Sonar Grid Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.55"/>
  <circle cx="256" cy="256" r="55" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-opacity="0.8" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#00f0ff" filter="url(#glow)"/>
  <!-- Sweep lines -->
  <line x1="256" y1="30" x2="256" y2="482" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="30" y1="256" x2="482" y2="256" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Radar beam segment -->
  <path d="M256,256 L380,132 A175,175 0 0,0 256,81 Z" fill="url(#cyanGlow)" opacity="0.35"/>
  <!-- Debris blips -->
  <circle cx="320" cy="180" r="8" fill="#ff3366" filter="url(#glow)"/>
  <circle cx="190" cy="330" r="7" fill="#00ff88" filter="url(#glow)"/>
  <circle cx="340" cy="310" r="6" fill="#ffbb00"/>
  <!-- Subtitle -->
  <text x="256" y="450" text-anchor="middle" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" letter-spacing="4">SONARX</text>
  <text x="256" y="480" text-anchor="middle" fill="#7ec8e3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" letter-spacing="2">DEBRISGUARD</text>
</svg>